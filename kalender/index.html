<!DOCTYPE html>
<html lang="nl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalender</title>
    <link rel="stylesheet" href="style.css" />
    <script src="main.js" defer></script>
</head>

<body>

    <main class="calender">
        <header class="header">
            <button class="navbutton" id="prev" type="button" aria-label="Vorige maand">&larr;</button>
            <h1 id="date" aria-live="polite"></h1>
            <button class="navbutton" id="next" type="button" aria-label="Volgende maand">&rarr;</button>
        </header>

        <ol class="weekdays" aria-hidden="true">
            <li class="weekday">MA</li>
            <li class="weekday">DI</li>
            <li class="weekday">WO</li>
            <li class="weekday">DO</li>
            <li class="weekday">VR</li>
            <li class="weekday">ZA</li>
            <li class="weekday">ZO</li>
        </ol>

        <ol id="days" class="days" aria-label="Dagen van de maand"></ol>

    </main>
</body>

</html>
